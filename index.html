<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #180B30 0%, #3B1578 50%, #200B4B 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(192, 132, 252, 0.5);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <!-- Frame do Celular -->
  <div class="w-full max-w-sm h-[750px] bg-gradient-to-b from-[#280E52] via-[#1A0938] to-[#0D041D] rounded-[40px] border-4 border-purple-900/50 p-5 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.3)]">
    
    <!-- Efeitos de Fundo -->
    <div class="absolute -top-10 -left-10 w-56 h-56 bg-purple-500/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 -right-10 w-48 h-48 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="z-10 overflow-y-auto pr-1">
      <!-- Header -->
      <div class="flex justify-between items-center pt-2 mb-6">
        <div>
          <p class="text-purple-300/80 text-sm">Hello 👋</p>
          <h1 class="text-xl font-bold text-white tracking-wide">Suno Player</h1>
        </div>
        <span class="glass-card text-xs text-purple-200 font-semibold px-3 py-1.5 rounded-full flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-pink-400"></i> VIP
        </span>
      </div>

      <!-- Banner Rápido Tocador -->
      <div class="glass-card p-4 rounded-2xl mb-6 flex justify-between items-center border-l-4 border-l-purple-500">
        <div>
          <h3 class="font-bold text-sm text-purple-100">Player Estelar</h3>
          <p class="text-xs text-purple-300/70">Ir para o tocador visual</p>
        </div>
        <a href="player.html" class="bg-gradient-to-r from-purple-600 to-indigo-600 p-2.5 rounded-xl text-white hover:from-purple-500 shadow-md shadow-purple-600/30 transition">
          <i data-lucide="play" class="w-5 h-5 fill-white"></i>
        </a>
      </div>

      <!-- Título da Lista -->
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-semibold text-purple-200/80 uppercase tracking-wider">Suas Músicas do Suno</h2>
        <span id="trackCount" class="text-xs text-purple-400 font-medium">0 faixas</span>
      </div>

      <div id="trackList" class="space-y-3">
        <!-- Lista gerada via JS -->
      </div>
    </div>

    <!-- Navegação Inferior Gloss -->
    <div class="glass-card rounded-full p-3 flex justify-around items-center z-10 mt-2">
      <a href="index.html" class="bg-gradient-to-r from-purple-500 to-pink-500 p-2.5 rounded-full text-white shadow-lg shadow-purple-500/50">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <a href="add.html" class="text-purple-300/70 hover:text-white transition p-2">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </a>
      <a href="player.html" class="text-purple-300/70 hover:text-white transition p-2">
        <i data-lucide="disc" class="w-5 h-5"></i>
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // MÚSICAS HOSPEDADAS NO SEU GITHUB
    // Altere aqui com os caminhos dos seus MP3s salvos na pasta /musicas
    const defaultTracks = [
      { id: '1', title: 'Protocole', genre: 'Spoken Word / Indie French', audioUrl: './musicas/protocole.mp3' },
      { id: '2', title: 'ELEVATED STATE', genre: 'Modern K-Pop Anthem', audioUrl: './musicas/elevated-state.mp3' },
      { id: '3', title: 'Cyberpunk Neon Vibe', genre: 'Synthwave / Suno AI', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' }
    ];

    function loadTracks() {
      const stored = localStorage.getItem('suno_tracks_v2');
      const tracks = stored ? JSON.parse(stored) : defaultTracks;

      if (!stored) {
        localStorage.setItem('suno_tracks_v2', JSON.stringify(defaultTracks));
      }

      const container = document.getElementById('trackList');
      const trackCount = document.getElementById('trackCount');
      
      container.innerHTML = '';
      trackCount.innerText = `${tracks.length} ${tracks.length === 1 ? 'faixa' : 'faixas'}`;

      tracks.forEach((track) => {
        container.innerHTML += `
          <div onclick="playTrack('${encodeURIComponent(JSON.stringify(track))}')" class="glass-card glass-card-hover p-3 rounded-2xl flex items-center justify-between cursor-pointer transition-all duration-200 group">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-700 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-purple-900/50 group-hover:scale-105 transition">
                <i data-lucide="music" class="w-5 h-5"></i>
              </div>
              <div class="max-w-[170px]">
                <h4 class="font-bold text-sm text-purple-50 truncate">${track.title}</h4>
                <p class="text-xs text-purple-300/70 truncate">${track.genre}</p>
              </div>
            </div>
            <div class="w-8 h-8 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-300 group-hover:bg-purple-500 group-hover:text-white transition">
              <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
            </div>
          </div>
        `;
      });

      lucide.createIcons();
    }

    function playTrack(encodedTrack) {
      const track = JSON.parse(decodeURIComponent(encodedTrack));
      localStorage.setItem('current_track', JSON.stringify(track));
      window.location.href = 'player.html';
    }

    loadTracks();
  </script>
</body>
</html>
