<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #180B30 0%, #3B1578 50%, #200B4B 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(192, 132, 252, 0.5);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <div class="w-full max-w-sm h-[750px] bg-gradient-to-b from-[#280E52] via-[#1A0938] to-[#0D041D] rounded-[40px] border-4 border-purple-900/50 p-5 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.3)]">
    
    <div class="absolute -top-10 -left-10 w-56 h-56 bg-purple-500/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 -right-10 w-48 h-48 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="z-10 overflow-y-auto pr-1">
      <div class="flex justify-between items-center pt-2 mb-6">
        <div>
          <p class="text-purple-300/80 text-sm">Hello 👋</p>
          <h1 class="text-xl font-bold text-white tracking-wide">Suno Player</h1>
        </div>
        <span class="glass-card text-xs text-purple-200 font-semibold px-3 py-1.5 rounded-full flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-pink-400"></i> VIP
        </span>
      </div>

      <div class="glass-card p-4 rounded-2xl mb-6 flex justify-between items-center border-l-4 border-l-purple-500">
        <div>
          <h3 class="font-bold text-sm text-purple-100">Player Estelar</h3>
          <p class="text-xs text-purple-300/70">Ir para o tocador visual</p>
        </div>
        <a href="player.html" class="bg-gradient-to-r from-purple-600 to-indigo-600 p-2.5 rounded-xl text-white hover:from-purple-500 shadow-md transition">
          <i data-lucide="play" class="w-5 h-5 fill-white"></i>
        </a>
      </div>

      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-semibold text-purple-200/80 uppercase tracking-wider">Suas Músicas do Suno</h2>
        <span id="trackCount" class="text-xs text-purple-400 font-medium">Buscando...</span>
      </div>

      <div id="trackList" class="space-y-3">
        <p class="text-xs text-purple-300/60 text-center py-4">Carregando faixas da pasta...</p>
      </div>
    </div>

    <div class="glass-card rounded-full p-3 flex justify-around items-center z-10 mt-2">
      <a href="index.html" class="bg-gradient-to-r from-purple-500 to-pink-500 p-2.5 rounded-full text-white shadow-lg shadow-purple-500/50">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <a href="add.html" class="text-purple-300/70 hover:text-white transition p-2"><i data-lucide="plus" class="w-6 h-6"></i></a>
      <a href="player.html" class="text-purple-300/70 hover:text-white transition p-2"><i data-lucide="disc" class="w-5 h-5"></i></a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // LEITURA AUTOMÁTICA DA PASTA VIA GITHUB API
    const REPO_USER = 'cibelearabise-spec';
    const REPO_NAME = 'teste';
    const FOLDER_PATH = 'musicas';

    async function loadTracksFromGithub() {
      const container = document.getElementById('trackList');
      const trackCount = document.getElementById('trackCount');

      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`);
        
        if (!response.ok) throw new Error('Não foi possível ler a pasta');
        
        const files = await response.json();
        
        // Filtra apenas arquivos que terminam com .mp3
        const mp3Files = files.filter(file => file.name.endsWith('.mp3'));

        if (mp3Files.length === 0) {
          container.innerHTML = '<p class="text-xs text-purple-300/60 text-center py-4">Nenhuma música encontrada na pasta /musicas.</p>';
          trackCount.innerText = '0 faixas';
          return;
        }

        container.innerHTML = '';
        trackCount.innerText = `${mp3Files.length} ${mp3Files.length === 1 ? 'faixa' : 'faixas'}`;

        // Capas padronizadas para alternar automaticamente
        const defaultCovers = [
          'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80',
          'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&q=80',
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&q=80',
          'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&q=80'
        ];

        mp3Files.forEach((file, index) => {
          // Formata o título removendo o .mp3 e substituindo _ por espaço
          const rawTitle = file.name.replace('.mp3', '').replace(/_/g, ' ');
          const formattedTitle = rawTitle.charAt(0).toUpperCase() + rawTitle.slice(1);
          
          const track = {
            id: file.sha,
            title: formattedTitle,
            genre: 'Suno Track',
            audioUrl: file.path, // Caminho direto: musicas/nome.mp3
            coverUrl: defaultCovers[index % defaultCovers.length]
          };

          container.innerHTML += `
            <div onclick="playTrack('${encodeURIComponent(JSON.stringify(track))}')" class="glass-card glass-card-hover p-2.5 rounded-2xl flex items-center justify-between cursor-pointer transition-all group">
              <div class="flex items-center gap-3">
                <img src="${track.coverUrl}" class="w-11 h-11 rounded-xl object-cover shadow-md">
                <div class="max-w-[160px]">
                  <h4 class="font-bold text-sm text-purple-50 truncate">${track.title}</h4>
                  <p class="text-xs text-purple-300/70 truncate">${track.genre}</p>
                </div>
              </div>
              <div class="w-8 h-8 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-300 group-hover:bg-purple-500 group-hover:text-white transition">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </div>
            </div>
          `;
        });

        lucide.createIcons();

      } catch (error) {
        console.error(error);
        container.innerHTML = '<p class="text-xs text-red-400 text-center py-4">Erro ao carregar a lista de músicas.</p>';
        trackCount.innerText = 'Erro';
      }
    }

    function playTrack(encodedTrack) {
      const track = JSON.parse(decodeURIComponent(encodedTrack));
      localStorage.setItem('current_track', JSON.stringify(track));
      window.location.href = 'player.html';
    }

    loadTracksFromGithub();
  </script>
</body>
</html>
