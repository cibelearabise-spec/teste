<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #180B30 0%, #3B1578 50%, #200B4B 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(192, 132, 252, 0.5);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }
    .glass-input {
      background: rgba(15, 7, 32, 0.5);
      border: 1px solid rgba(192, 132, 252, 0.3);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <div class="w-full max-w-sm h-[750px] bg-gradient-to-b from-[#280E52] via-[#1A0938] to-[#0D041D] rounded-[40px] border-4 border-purple-900/50 p-5 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.3)]">
    
    <div class="absolute -top-10 -left-10 w-56 h-56 bg-purple-500/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 -right-10 w-48 h-48 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="z-10 overflow-y-auto pr-1 h-full flex flex-col">
      <!-- Header -->
      <div class="flex justify-between items-center pt-2 mb-4">
        <div>
          <p class="text-purple-300/80 text-xs">Sua Biblioteca</p>
          <h1 class="text-xl font-bold text-white tracking-wide">Suno Player</h1>
        </div>
        <span class="glass-card text-xs text-purple-200 font-semibold px-3 py-1.5 rounded-full flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-pink-400"></i> VIP
        </span>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="relative mb-3">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3.5 text-purple-300/60"></i>
        <input type="text" id="searchInput" oninput="filterTracks()" placeholder="Buscar por nome ou gênero..." class="w-full glass-input pl-9 pr-4 py-2.5 rounded-2xl text-xs text-white focus:outline-none focus:border-purple-400">
      </div>

      <!-- Filtro por Chips de Gênero -->
      <div id="genreContainer" class="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-1">
        <!-- Gerado via JS -->
      </div>

      <!-- Cabeçalho da Lista -->
      <div class="flex items-center justify-between mb-2">
        <h2 id="listTitle" class="text-xs font-semibold text-purple-200/80 uppercase tracking-wider">Todas as Músicas</h2>
        <span id="trackCount" class="text-xs text-purple-400 font-medium">0 faixas</span>
      </div>

      <!-- Lista de Músicas -->
      <div id="trackList" class="space-y-2.5 overflow-y-auto flex-1 pr-1"></div>
    </div>

    <!-- Navegação -->
    <div class="glass-card rounded-full p-3 flex justify-around items-center z-10 mt-2">
      <a href="index.html" class="bg-gradient-to-r from-purple-500 to-pink-500 p-2.5 rounded-full text-white shadow-lg shadow-purple-500/50">
        <i data-lucide="home" class="w-5 h-5"></i>
      </a>
      <a href="add.html" class="text-purple-300/70 hover:text-white transition p-2"><i data-lucide="plus" class="w-6 h-6"></i></a>
      <a href="player.html" class="text-purple-300/70 hover:text-white transition p-2"><i data-lucide="disc" class="w-5 h-5"></i></a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    let allTracks = [];
    let selectedGenre = 'Todos';

    async function loadData() {
      try {
        // Adicionado ?v= + Date.now() para ignorar o cache e carregar sempre o arquivo novo
        const response = await fetch('musicas.json?v=' + Date.now());
        allTracks = await response.json();
        
        renderGenreChips();
        filterTracks();
      } catch (err) {
        console.error("Erro ao carregar musicas.json", err);
        document.getElementById('trackList').innerHTML = '<p class="text-xs text-red-400 text-center py-4">Verifique se o arquivo musicas.json existe no GitHub e está sem erros.</p>';
      }
    }

    function renderGenreChips() {
      const mainGenres = allTracks.map(t => {
        if (!t.genre) return 'Geral';
        return t.genre.split(',')[0].split('/')[0].trim();
      });
      
      const genres = ['Todos', 'Favoritos', ...new Set(mainGenres)];
      const container = document.getElementById('genreContainer');
      
      container.innerHTML = genres.map(genre => `
        <button onclick="selectGenre('${genre}')" class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${selectedGenre === genre ? 'bg-purple-500 text-white shadow-md shadow-purple-500/30' : 'glass-card text-purple-200 hover:bg-white/10'}">
          ${genre === 'Favoritos' ? '❤️ Favoritos' : genre}
        </button>
      `).join('');
    }

    function selectGenre(genre) {
      selectedGenre = genre;
      renderGenreChips();
      filterTracks();
    }

    function getFavorites() {
      return JSON.parse(localStorage.getItem('suno_favs')) || [];
    }

    function toggleFavorite(e, trackId) {
      e.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(trackId)) {
        favs = favs.filter(id => id !== trackId);
      } else {
        favs.push(trackId);
      }
      localStorage.setItem('suno_favs', JSON.stringify(favs));
      filterTracks();
    }

    function filterTracks() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const favs = getFavorites();

      let filtered = allTracks.filter(track => {
        const matchesSearch = track.title.toLowerCase().includes(query) || track.genre.toLowerCase().includes(query);
        const mainGenre = track.genre ? track.genre.split(',')[0].split('/')[0].trim() : 'Geral';
        
        if (selectedGenre === 'Todos') return matchesSearch;
        if (selectedGenre === 'Favoritos') return matchesSearch && favs.includes(track.id);
        return matchesSearch && mainGenre === selectedGenre;
      });

      renderTracks(filtered);
    }

    function renderTracks(tracks) {
      const container = document.getElementById('trackList');
      const trackCount = document.getElementById('trackCount');
      const favs = getFavorites();

      trackCount.innerText = `${tracks.length} ${tracks.length === 1 ? 'faixa' : 'faixas'}`;
      container.innerHTML = '';

      if (tracks.length === 0) {
        container.innerHTML = '<p class="text-xs text-purple-300/60 text-center py-8">Nenhuma música encontrada.</p>';
        return;
      }

      tracks.forEach(track => {
        const isFav = favs.includes(track.id);
        container.innerHTML += `
          <div onclick="playTrack('${encodeURIComponent(JSON.stringify(track))}')" class="glass-card glass-card-hover p-2.5 rounded-2xl flex items-center justify-between cursor-pointer transition-all group">
            <div class="flex items-center gap-3">
              <img src="${track.coverUrl}" class="w-11 h-11 rounded-xl object-cover shadow-md">
              <div class="max-w-[140px]">
                <h4 class="font-bold text-sm text-purple-50 truncate">${track.title}</h4>
                <p class="text-xs text-purple-300/70 truncate">${track.genre}</p>
              </div>
            </div>
            
            <div class="flex items-center gap-2">
              <button onclick="toggleFavorite(event, '${track.id}')" class="p-1.5 text-purple-300 hover:text-pink-400 transition">
                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-pink-500 text-pink-500' : ''}"></i>
              </button>
              <div class="w-8 h-8 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-300 group-hover:bg-purple-500 group-hover:text-white transition">
                <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
              </div>
            </div>
          </div>
        `;
      });

      lucide.createIcons();
    }

    function playTrack(encodedTrack) {
      const track = JSON.parse(decodeURIComponent(encodedTrack));
      localStorage.setItem('current_track', JSON.stringify(track));
      window.location.href = 'player.html';
    }

    loadData();
  </script>
</body>
</html>
