<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Tocador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0B0914; font-family: system-ui, sans-serif; }
    .glass-card { background: rgba(23, 19, 38, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(168, 85, 247, 0.2); }
    .glow-sphere {
      background: radial-gradient(circle at 30% 30%, #EC4899, #8B5CF6, #3B82F6);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.6);
    }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <div class="w-full max-w-sm h-[750px] bg-[#0B0914] rounded-[40px] border-4 border-gray-800 p-5 flex flex-col justify-between relative overflow-hidden shadow-2xl">
    
    <!-- Topo -->
    <div class="flex justify-between items-center z-10 pt-2">
      <a href="index.html" class="text-gray-400 hover:text-white"><i data-lucide="chevron-left"></i></a>
      <p class="text-xs text-gray-400 uppercase tracking-widest">Suno Assistant</p>
      <i data-lucide="more-vertical" class="text-gray-400"></i>
    </div>

    <!-- Centro: Esfera e Título -->
    <div class="flex flex-col items-center justify-center my-auto z-10">
      <p id="statusText" class="text-gray-300 text-lg font-light mb-8">Ready to play...</p>

      <!-- Esfera Glow Neon -->
      <div class="relative flex items-center justify-center w-48 h-48 mb-8">
        <div id="glowPulse" class="absolute inset-0 rounded-full bg-purple-600/30 blur-xl"></div>
        <div id="sphereBtn" onclick="togglePlay()" class="w-40 h-40 rounded-full glow-sphere flex items-center justify-center cursor-pointer transition-transform hover:scale-105">
          <i id="playIcon" data-lucide="play" class="w-12 h-12 text-white fill-white ml-1"></i>
        </div>
      </div>

      <h2 id="trackTitle" class="text-lg font-bold text-white text-center">Cyberpunk Neon Vibe</h2>
      <p id="trackGenre" class="text-xs text-gray-400 mt-1">Suno AI Generated</p>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="audioPlayer"></audio>

    <!-- Barra e Controles -->
    <div class="z-10 mb-2">
      <div class="glass-card rounded-full p-3 flex justify-around items-center">
        <a href="index.html" class="text-gray-400 hover:text-purple-400"><i data-lucide="home"></i></a>
        <button onclick="togglePlay()" class="bg-purple-600 p-3 rounded-full text-white shadow-lg shadow-purple-500/50 hover:bg-purple-500">
          <i id="controlBtnIcon" data-lucide="play"></i>
        </button>
        <a href="add.html" class="text-gray-400 hover:text-purple-400"><i data-lucide="plus"></i></a>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    const audio = document.getElementById('audioPlayer');
    const playIcon = document.getElementById('playIcon');
    const controlBtnIcon = document.getElementById('controlBtnIcon');
    const statusText = document.getElementById('statusText');
    const glowPulse = document.getElementById('glowPulse');

    // Carregar faixa salva ou padrão
    const currentTrack = JSON.parse(localStorage.getItem('current_track')) || {
      title: 'Cyberpunk Neon Vibe',
      genre: 'Synthwave / Suno AI',
      audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
    };

    document.getElementById('trackTitle').innerText = currentTrack.title;
    document.getElementById('trackGenre').innerText = currentTrack.genre;
    audio.src = currentTrack.audioUrl;

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        statusText.innerText = "Playing track...";
        glowPulse.classList.add('animate-pulse');
        updateIcons(true);
      } else {
        audio.pause();
        statusText.innerText = "Paused";
        glowPulse.classList.remove('animate-pulse');
        updateIcons(false);
      }
    }

    function updateIcons(isPlaying) {
      if (isPlaying) {
        playIcon.setAttribute('data-lucide', 'pause');
        controlBtnIcon.setAttribute('data-lucide', 'pause');
      } else {
        playIcon.setAttribute('data-lucide', 'play');
        controlBtnIcon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
