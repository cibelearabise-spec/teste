<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Tocador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #180B30 0%, #3B1578 50%, #200B4B 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .cover-spin {
      animation: spin 20s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <div class="w-full max-w-sm h-[750px] bg-gradient-to-b from-[#280E52] via-[#1A0938] to-[#0D041D] rounded-[40px] border-4 border-purple-900/50 p-5 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.3)]">
    
    <!-- Topo -->
    <div class="flex justify-between items-center z-10 pt-2">
      <a href="index.html" class="text-purple-300 hover:text-white transition"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>
      <p class="text-xs text-purple-300/80 uppercase tracking-widest font-semibold">TOCANDO AGORA</p>
      <i data-lucide="more-vertical" class="text-purple-300 w-5 h-5"></i>
    </div>

    <!-- Capa da Música -->
    <div class="flex flex-col items-center justify-center my-auto z-10">
      <div class="relative flex items-center justify-center w-56 h-56 mb-6">
        <div id="glowBg" class="absolute inset-0 rounded-3xl bg-purple-600/30 blur-2xl transition-all"></div>
        <img id="trackCover" src="" class="w-52 h-52 rounded-3xl object-cover shadow-2xl relative z-10 border border-purple-300/20">
      </div>

      <h2 id="trackTitle" class="text-xl font-bold text-white text-center">---</h2>
      <p id="trackGenre" class="text-xs text-purple-300/70 mt-1 text-center">---</p>
    </div>

    <!-- Áudio -->
    <audio id="audioPlayer"></audio>

    <!-- Botão Principal de Play/Pause -->
    <div class="glass-card rounded-3xl p-4 flex flex-col gap-4 z-10 mb-2">
      <div class="flex justify-center items-center gap-6">
        <button onclick="togglePlay()" class="w-16 h-16 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/50 hover:scale-105 transition">
          <i id="playIcon" data-lucide="play" class="w-7 h-7 fill-white ml-1"></i>
        </button>
      </div>
    </div>

    <!-- Navegação -->
    <div class="glass-card rounded-full p-3 flex justify-around items-center z-10">
      <a href="index.html" class="text-purple-300/70 hover:text-white"><i data-lucide="home"></i></a>
      <a href="add.html" class="text-purple-300/70 hover:text-white"><i data-lucide="plus"></i></a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    const audio = document.getElementById('audioPlayer');
    const playIcon = document.getElementById('playIcon');
    const trackCover = document.getElementById('trackCover');

    const currentTrack = JSON.parse(localStorage.getItem('current_track')) || {
      title: 'Protocole',
      genre: 'Spoken Word / Indie French',
      audioUrl: './musicas/protocole.mp3',
      coverUrl: 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80'
    };

    document.getElementById('trackTitle').innerText = currentTrack.title;
    document.getElementById('trackGenre').innerText = currentTrack.genre;
    trackCover.src = currentTrack.coverUrl || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80';
    audio.src = currentTrack.audioUrl;

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.setAttribute('data-lucide', 'pause');
          trackCover.classList.add('cover-spin');
          lucide.createIcons();
        });
      } else {
        audio.pause();
        playIcon.setAttribute('data-lucide', 'play');
        trackCover.classList.remove('cover-spin');
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
