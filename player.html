<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Tocador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #180B30 0%, #3B1578 50%, #200B4B 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .glow-sphere {
      background: radial-gradient(circle at 30% 30%, #EC4899, #8B5CF6, #3B82F6);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.7);
    }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <div class="w-full max-w-sm h-[750px] bg-gradient-to-b from-[#280E52] via-[#1A0938] to-[#0D041D] rounded-[40px] border-4 border-purple-900/50 p-5 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.3)]">
    
    <!-- Topo -->
    <div class="flex justify-between items-center z-10 pt-2">
      <a href="index.html" class="text-purple-300 hover:text-white transition"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>
      <p class="text-xs text-purple-300/80 uppercase tracking-widest font-semibold">Suno Assistant</p>
      <i data-lucide="more-vertical" class="text-purple-300 w-5 h-5"></i>
    </div>

    <!-- Centro: Esfera e Informações -->
    <div class="flex flex-col items-center justify-center my-auto z-10">
      <p id="statusText" class="text-purple-200 text-lg font-light mb-8">Ready to play...</p>

      <div class="relative flex items-center justify-center w-48 h-48 mb-8">
        <div id="glowPulse" class="absolute inset-0 rounded-full bg-purple-600/30 blur-xl"></div>
        <div id="sphereBtn" onclick="togglePlay()" class="w-40 h-40 rounded-full glow-sphere flex items-center justify-center cursor-pointer transition-transform hover:scale-105 active:scale-95">
          <i id="playIcon" data-lucide="play" class="w-12 h-12 text-white fill-white ml-1"></i>
        </div>
      </div>

      <h2 id="trackTitle" class="text-xl font-bold text-white text-center">Selecione uma música</h2>
      <p id="trackGenre" class="text-xs text-purple-300/70 mt-1">Suno AI Generated</p>
    </div>

    <!-- Áudio do Navegador -->
    <audio id="audioPlayer"></audio>

    <!-- Barra de Controles Inferior -->
    <div class="glass-card rounded-full p-3 flex justify-around items-center z-10">
      <a href="index.html" class="text-purple-300/70 hover:text-white"><i data-lucide="home"></i></a>
      <button onclick="togglePlay()" class="bg-gradient-to-r from-purple-500 to-pink-500 p-3 rounded-full text-white shadow-lg shadow-purple-500/50 hover:scale-105 transition">
        <i id="controlBtnIcon" data-lucide="play" class="w-5 h-5 fill-white"></i>
      </button>
      <a href="add.html" class="text-purple-300/70 hover:text-white"><i data-lucide="plus"></i></a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    const audio = document.getElementById('audioPlayer');
    const playIcon = document.getElementById('playIcon');
    const controlBtnIcon = document.getElementById('controlBtnIcon');
    const statusText = document.getElementById('statusText');
    const glowPulse = document.getElementById('glowPulse');

    const currentTrack = JSON.parse(localStorage.getItem('current_track')) || {
      title: 'Protocole',
      genre: 'Spoken Word / Indie French',
      audioUrl: './musicas/protocole.mp3'
    };

    document.getElementById('trackTitle').innerText = currentTrack.title;
    document.getElementById('trackGenre').innerText = currentTrack.genre;
    audio.src = currentTrack.audioUrl;

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          statusText.innerText = "Playing track...";
          glowPulse.classList.add('animate-pulse');
          updateIcons(true);
        }).catch(err => {
          alert("Não foi possível carregar o arquivo de áudio. Verifique se o caminho na pasta /musicas está correto.");
        });
      } else {
        audio.pause();
        statusText.innerText = "Paused";
        glowPulse.classList.remove('animate-pulse');
        updateIcons(false);
      }
    }

    function updateIcons(isPlaying) {
      if (isPlaying) {
        playIcon.setAttribute('data-lucide', 'pause');
        controlBtnIcon.setAttribute('data-lucide', 'pause');
      } else {
        playIcon.setAttribute('data-lucide', 'play');
        controlBtnIcon.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
