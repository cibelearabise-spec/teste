<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Enviar Música</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #180B30 0%, #3B1578 50%, #200B4B 100%);
      font-family: system-ui, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .glass-input {
      background: rgba(15, 7, 32, 0.4);
      border: 1px solid rgba(192, 132, 252, 0.3);
    }
    .glass-input:focus {
      border-color: #C084FC;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
    }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <!-- Frame do Celular -->
  <div class="w-full max-w-sm h-[750px] bg-gradient-to-b from-[#280E52] via-[#1A0938] to-[#0D041D] rounded-[40px] border-4 border-purple-900/50 p-5 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.3)]">
    
    <!-- Luz Neon de Fundo -->
    <div class="absolute -top-10 -right-10 w-56 h-56 bg-purple-500/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-20 -left-10 w-48 h-48 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="z-10">
      <!-- Topo -->
      <div class="flex items-center gap-3 pt-2 mb-6">
        <a href="index.html" class="text-purple-200 hover:text-white transition">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </a>
        <h1 class="text-lg font-bold text-purple-100 tracking-wide">Adicionar Música Suno</h1>
      </div>

      <!-- Formulário de Envio -->
      <form id="addForm" onsubmit="saveTrack(event)" class="space-y-4">
        <div>
          <label class="text-xs text-purple-200 font-medium block mb-1.5">Nome da Música</label>
          <input type="text" id="inputTitle" required placeholder="Ex: Minha Trilha Suno" class="w-full glass-input p-3.5 rounded-2xl text-sm text-white placeholder-purple-300/50 focus:outline-none transition">
        </div>

        <div>
          <label class="text-xs text-purple-200 font-medium block mb-1.5">Gênero / Estilo</label>
          <input type="text" id="inputGenre" placeholder="Ex: Rock / Pop AI" class="w-full glass-input p-3.5 rounded-2xl text-sm text-white placeholder-purple-300/50 focus:outline-none transition">
        </div>

        <!-- Seletor de Arquivo de Áudio do Computador -->
        <div>
          <label class="text-xs text-purple-200 font-medium block mb-1.5">Arquivo de Áudio (.mp3 / .wav)</label>
          <div class="relative">
            <input type="file" id="inputFile" accept="audio/*" required onchange="updateFileName(this)" class="hidden">
            <label for="inputFile" class="w-full glass-card p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border-2 border-dashed border-purple-400/40 hover:border-purple-400 transition group">
              <i data-lucide="upload-cloud" class="w-8 h-8 text-purple-300 group-hover:scale-110 transition mb-1"></i>
              <span id="fileNameDisplay" class="text-xs text-purple-200 font-medium text-center">Clique para escolher o arquivo no PC</span>
            </label>
          </div>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 p-4 rounded-2xl font-bold text-sm shadow-[0_0_20px_rgba(168,85,247,0.4)] transition active:scale-[0.98] mt-2">
          Salvar Músicas no App
        </button>
      </form>
    </div>

    <!-- Navegação Inferior Gloss -->
    <div class="glass-card rounded-full p-3 flex justify-around items-center z-10">
      <a href="index.html" class="text-purple-300/70 hover:text-white transition"><i data-lucide="home"></i></a>
      <a href="add.html" class="bg-gradient-to-r from-purple-500 to-pink-500 p-3 rounded-full text-white shadow-lg shadow-purple-500/50"><i data-lucide="plus"></i></a>
      <a href="player.html" class="text-purple-300/70 hover:text-white transition"><i data-lucide="disc"></i></a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    let selectedAudioData = null;

    function updateFileName(input) {
      const display = document.getElementById('fileNameDisplay');
      if (input.files && input.files[0]) {
        const file = input.files[0];
        display.innerText = `Selecionado: ${file.name}`;
        
        // Converte o arquivo do computador para URL acessível no navegador
        selectedAudioData = URL.createObjectURL(file);
      }
    }

    function saveTrack(e) {
      e.preventDefault();
      const title = document.getElementById('inputTitle').value;
      const genre = document.getElementById('inputGenre').value || 'Suno AI Track';

      if (!selectedAudioData) {
        alert("Por favor, selecione um arquivo de áudio do seu computador.");
        return;
      }

      const stored = localStorage.getItem('suno_tracks');
      const tracks = stored ? JSON.parse(stored) : [];

      tracks.unshift({ 
        id: Date.now().toString(), 
        title, 
        genre, 
        audioUrl: selectedAudioData 
      });

      localStorage.setItem('suno_tracks', JSON.stringify(tracks));
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
