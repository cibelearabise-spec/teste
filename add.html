<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Player - Adicionar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #180B30 0%, #3B1578 50%, #200B4B 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(216, 180, 254, 0.2);
    }
    .glass-input {
      background: rgba(15, 7, 32, 0.4);
      border: 1px solid rgba(192, 132, 252, 0.3);
    }
  </style>
</head>
<body class="text-white flex justify-center items-center min-h-screen p-2 sm:p-4">

  <div class="w-full max-w-sm h-[750px] bg-gradient-to-b from-[#280E52] via-[#1A0938] to-[#0D041D] rounded-[40px] border-4 border-purple-900/50 p-5 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(147,51,234,0.3)]">
    
    <div class="z-10">
      <div class="flex items-center gap-3 pt-2 mb-6">
        <a href="index.html" class="text-purple-200 hover:text-white transition">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </a>
        <h1 class="text-lg font-bold text-purple-100">Adicionar Música Suno</h1>
      </div>

      <form id="addForm" onsubmit="saveTrack(event)" class="space-y-4">
        <div>
          <label class="text-xs text-purple-200 block mb-1">Nome da Música</label>
          <input type="text" id="inputTitle" required placeholder="Ex: Minha Nova Faixa" class="w-full glass-input p-3.5 rounded-2xl text-sm text-white focus:outline-none">
        </div>

        <div>
          <label class="text-xs text-purple-200 block mb-1">Gênero / Estilo</label>
          <input type="text" id="inputGenre" placeholder="Ex: Rock / Pop AI" class="w-full glass-input p-3.5 rounded-2xl text-sm text-white focus:outline-none">
        </div>

        <div>
          <label class="text-xs text-purple-200 block mb-1">Caminho da Música na Pasta /musicas</label>
          <input type="text" id="inputUrl" required placeholder="./musicas/minhamusica.mp3" class="w-full glass-input p-3.5 rounded-2xl text-sm text-white focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 p-4 rounded-2xl font-bold text-sm shadow-lg hover:from-purple-500 transition mt-2">
          Salvar Música no App
        </button>
      </form>
    </div>

    <div class="glass-card rounded-full p-3 flex justify-around items-center z-10">
      <a href="index.html" class="text-purple-300/70 hover:text-white"><i data-lucide="home"></i></a>
      <a href="add.html" class="bg-gradient-to-r from-purple-500 to-pink-500 p-3 rounded-full text-white"><i data-lucide="plus"></i></a>
      <a href="player.html" class="text-purple-300/70 hover:text-white"><i data-lucide="disc"></i></a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function saveTrack(e) {
      e.preventDefault();
      const title = document.getElementById('inputTitle').value;
      const genre = document.getElementById('inputGenre').value || 'Suno AI Track';
      const audioUrl = document.getElementById('inputUrl').value;

      const stored = localStorage.getItem('suno_tracks_v2');
      const tracks = stored ? JSON.parse(stored) : [];

      tracks.unshift({ id: Date.now().toString(), title, genre, audioUrl });
      localStorage.setItem('suno_tracks_v2', JSON.stringify(tracks));

      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
